# Builds and publishes the container image when a version tag is pushed.
#   1. Bump `version` under [workspace.package] in Cargo.toml and commit it.
#   2. git tag v0.2.0 && git push origin v0.2.0
# The tag must equal the Cargo version (the server reports that version at /admin/me).
# Images: ghcr.io/<owner>/payrouters:<version>, :<major>.<minor>, and :latest for stable releases.
# Run it by hand (Actions > release-image > Run workflow) to test the build: nothing is pushed.
name: release-image

on:
  workflow_dispatch:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

permissions:
  contents: read
  packages: write

concurrency:
  group: release-image-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Tag must match the Cargo version
        id: version
        run: |
          cargo_version=$(sed -n '/^\[workspace.package\]/,/^\[/{s/^version *= *"\(.*\)"/\1/p}' Cargo.toml)
          tag_version="${GITHUB_REF_NAME#v}"
          echo "Cargo.toml: $cargo_version, ref: $GITHUB_REF_NAME"
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "value=$cargo_version" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$cargo_version" ] || [ "$cargo_version" != "$tag_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the workspace version $cargo_version in Cargo.toml"
            exit 1
          fi
          echo "value=$tag_version" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' && !contains(github.ref_name, '-') }}
            type=raw,value=test-build,enable=${{ github.ref_type != 'tag' }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.ref_type == 'tag' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
