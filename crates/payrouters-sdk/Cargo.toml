[package]
name = "payrouters-sdk"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
hex = "0.4.3"
hmac = "0.13.0"
payrouters-types = { version = "0.4.1", path = "../payrouters-types" }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "query", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.2"
subtle = "2.6.1"
thiserror = "2.0.21"
uuid = "1.29.3"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["rt", "macros"] }
