[package]
name = "payrouters-server"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
aes-gcm = "0.11.1"
anyhow = "1.0.105"
async-trait = "0.1.92"
axum = { version = "0.8.9", features = ["macros"] }
base64 = "0.23.1"
bytes = "1.12.2"
chrono = { version = "0.4.45", default-features = false, features = ["serde", "clock", "std"] }
chrono-tz = "0.10.4"
csv = "1.4.0"
futures-util = "0.3.34"
getrandom = "0.4.3"
hex = "0.4.3"
hmac = "0.13.0"
payrouters-types = { version = "0.5.1", path = "../payrouters-types" }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }

serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

sha2 = "0.11.2"
sqlx = { version = "0.9.1", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json", "migrate", "macros"] }
subtle = "2.6.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["cors", "trace", "fs", "compression-gzip", "set-header", "timeout"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
url = "2.5.9"
uuid = { version = "1.29.3", features = ["v7", "serde"] }

[dev-dependencies]
wiremock = "0.6.5"
payrouters-sdk = { path = "../payrouters-sdk" }
tower = { version = "0.5.3", features = ["util"] }
